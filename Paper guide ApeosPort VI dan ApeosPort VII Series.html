<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Paper Guide — ApeosPort VI & Apeos VII</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#0B1E3A;
    --navy-900:#0F2547;
    --navy-800:#173868;
    --navy-700:#1E4976;
    --bg:#F4F6F9;
    --card:#FFFFFF;
    --border:#E4E8EE;
    --text:#151B2B;
    --text-muted:#66707F;
    --text-faint:#94A0B3;
    --radius-lg:14px;
    --radius-md:10px;
    --radius-sm:7px;
    --shadow-card: 0 1px 2px rgba(15,37,71,.06), 0 1px 1px rgba(15,37,71,.04);
    --shadow-card-hover: 0 6px 16px rgba(15,37,71,.10), 0 2px 4px rgba(15,37,71,.06);
    --shadow-header: 0 2px 10px rgba(11,30,58,.18);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  a{color:inherit;}

  /* ---------- Header ---------- */
  header{
    position:sticky;
    top:0;
    z-index:20;
    background:linear-gradient(155deg,var(--navy-900) 0%,var(--navy-950) 100%);
    box-shadow:var(--shadow-header);
    padding-top:calc(20px + env(safe-area-inset-top,0px));
  }
  .header-inner{
    max-width:900px;
    margin:0 auto;
    padding:0 20px 20px;
  }
  .brand-row{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .brand-mark{
    width:38px;height:38px;
    border-radius:9px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.16);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{width:20px;height:20px;}
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    color:#fff;
    letter-spacing:-0.01em;
  }
  header p.subtitle{
    margin:2px 0 0;
    font-size:13px;
    color:#A7B4CB;
    font-weight:500;
  }

  /* ---------- Search ---------- */
  .search-wrap{
    max-width:900px;
    margin:-24px auto 0;
    padding:0 20px;
    position:relative;
    z-index:10;
  }
  .search-box{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    box-shadow:var(--shadow-card);
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 14px;
  }
  .search-box svg{flex-shrink:0;color:var(--text-faint);}
  .search-box input{
    border:none;
    outline:none;
    font-family:inherit;
    font-size:14.5px;
    color:var(--text);
    width:100%;
    background:transparent;
  }
  .search-box input::placeholder{color:var(--text-faint);}
  .result-count{
    max-width:900px;
    margin:14px auto 0;
    padding:0 22px;
    font-size:12.5px;
    color:var(--text-muted);
    font-weight:500;
  }

  /* ---------- Main / list ---------- */
  main{
    max-width:900px;
    margin:0 auto;
    padding:24px 20px 48px;
  }

  .card-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:12px;
  }
  @media (max-width:640px){
    .card-grid{grid-template-columns:1fr;}
  }

  .paper-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:16px 16px 14px;
    cursor:pointer;
    text-align:left;
    width:100%;
    font-family:inherit;
    transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .paper-card:hover{
    box-shadow:var(--shadow-card-hover);
    border-color:#D3DAE4;
    transform:translateY(-1px);
  }
  .paper-card:focus-visible{
    outline:2px solid var(--navy-700);
    outline-offset:2px;
  }
  .paper-card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .paper-name{
    font-size:15.5px;
    font-weight:700;
    color:var(--text);
    line-height:1.3;
  }
  .paper-meta{
    display:flex;
    flex-direction:column;
    gap:4px;
    font-size:13px;
    color:var(--text-muted);
  }
  .paper-meta-row{display:flex;gap:6px;}
  .paper-meta-row .label{color:var(--text-faint);min-width:64px;flex-shrink:0;}
  .paper-meta-row .value{color:var(--text-muted);font-weight:500;}

  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:4px 10px;
    border-radius:999px;
    font-size:12px;
    font-weight:600;
    white-space:nowrap;
    border:1px solid transparent;
  }
  .badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
  .badge-plain{background:#EAF4EE;color:#1F7A45;}
  .badge-heavy{background:#FCF2E2;color:#9A6412;}
  .badge-extraheavy{background:#FBEAEA;color:#B23A3A;}
  .badge-labels{background:#EFEAFB;color:#6842C2;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--text-muted);
  }
  .empty-state svg{color:var(--text-faint);margin-bottom:10px;}
  .empty-state p{margin:0;font-size:14px;}

  /* ---------- Detail view ---------- */
  #detailView{display:none;}
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:none;
    color:var(--navy-700);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    padding:8px 0;
    margin-top:14px;
  }
  .back-btn:hover{color:var(--navy-900);}

  .detail-card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-card);
    padding:24px 22px;
    margin-top:8px;
  }
  .detail-title{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin:0 0 4px;
  }
  .detail-sub{
    font-size:13px;
    color:var(--text-muted);
    margin:0 0 22px;
    font-weight:500;
  }

  .detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:18px;
  }
  @media (max-width:480px){
    .detail-grid{grid-template-columns:1fr;}
  }
  .detail-field{
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:13px 14px;
  }
  .detail-field .f-label{
    font-size:11.5px;
    color:var(--text-faint);
    font-weight:600;
    margin-bottom:4px;
  }
  .detail-field .f-value{
    font-size:14.5px;
    color:var(--text);
    font-weight:600;
    line-height:1.4;
  }

  .heat-panel{
    border-radius:var(--radius-lg);
    padding:20px 20px;
    background:linear-gradient(155deg,var(--navy-900) 0%,var(--navy-800) 100%);
    color:#fff;
    display:flex;
    align-items:center;
    gap:16px;
    box-shadow:0 4px 14px rgba(15,37,71,.20);
  }
  .heat-icon{
    width:46px;height:46px;
    border-radius:11px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.2);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .heat-icon svg{width:24px;height:24px;}
  .heat-text .heat-label{
    font-size:12px;
    color:#A7B4CB;
    font-weight:600;
    margin-bottom:3px;
  }
  .heat-text .heat-value{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.01em;
  }

  footer{
    max-width:900px;
    margin:0 auto;
    padding:10px 20px 30px;
    text-align:center;
    font-size:12px;
    color:var(--text-faint);
  }
  footer .credit{
    margin-top:8px;
    font-size:11.5px;
    font-weight:600;
    color:var(--text-muted);
  }

  @media (prefers-reduced-motion:no-preference){
    .paper-card{transition:box-shadow .15s ease, transform .15s ease, border-color .15s ease;}
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6"/><path d="M9 17h6"/></svg>
      </div>
      <div>
        <h1>Paper Guide</h1>
        <p class="subtitle">ApeosPort VI &amp; Apeos VII Series</p>
      </div>
    </div>
  </div>
</header>

<main>
  <div id="listView">
    <div class="card-grid" id="cardGrid"></div>
    <div class="empty-state" id="emptyState" style="display:none;">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <p>Tidak ada kertas yang cocok dengan pencarian.</p>
    </div>
  </div>

  <div id="detailView">
    <button class="back-btn" id="backBtn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Kembali ke daftar
    </button>
    <div class="detail-card">
      <p class="detail-sub" id="detailNo"></p>
      <h2 class="detail-title" id="detailName"></h2>
      <div class="detail-grid">
        <div class="detail-field">
          <div class="f-label">Ukuran</div>
          <div class="f-value" id="detailSize"></div>
        </div>
        <div class="detail-field">
          <div class="f-label">Gramatur</div>
          <div class="f-value" id="detailGrammage"></div>
        </div>
      </div>
      <div class="heat-panel">
        <div class="heat-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"/><path d="M12 18v4"/><path d="m4.9 4.9 2.8 2.8"/><path d="m16.3 16.3 2.8 2.8"/><path d="M2 12h4"/><path d="M18 12h4"/><path d="m4.9 19.1 2.8-2.8"/><path d="m16.3 7.7 2.8-2.8"/><circle cx="12" cy="12" r="4"/></svg>
        </div>
        <div class="heat-text">
          <div class="heat-label">Setting Pemanas</div>
          <div class="heat-value" id="detailHeat"></div>
        </div>
      </div>
    </div>
  </div>
</main>

<footer>
  Paper Guide internal reference — mengurangi resiko paper jam dan hasil cetak tidak optimal.
  <div class="credit">Rifat Azka Mushannief - Astragraphia Serpo Kediri</div>
</footer>

<script>
  const papers = [
    { no:1, jenis:"Art Paper 120", ukuran:"325x485, 325x480, 320x480", gramatur:"120 gsm", setting:"Heavyweight" },
    { no:2, jenis:"Art Paper 150", ukuran:"325x485, 325x480, 320x480", gramatur:"150 gsm", setting:"Heavyweight" },
    { no:3, jenis:"Art Paper 210", ukuran:"325x485, 325x480, 320x480", gramatur:"210 gsm", setting:"Extra Heavyweight" },
    { no:4, jenis:"Art Paper 260", ukuran:"325x485, 325x480, 320x480", gramatur:"260 gsm", setting:"Extra Heavyweight" },
    { no:5, jenis:"Vynil", ukuran:"325x485, 325x480, 320x480", gramatur:"-", setting:"Labels" },
    { no:6, jenis:"Bontak", ukuran:"325x485, 325x480, 320x480", gramatur:"-", setting:"Labels" },
    { no:7, jenis:"Hologram", ukuran:"325x485, 325x480, 320x480", gramatur:"-", setting:"Labels" },
    { no:8, jenis:"HVS", ukuran:"A3", gramatur:"70-80 gsm", setting:"Plain" }
  ];

  const badgeClass = {
    "Plain":"badge-plain",
    "Heavyweight":"badge-heavy",
    "Extra Heavyweight":"badge-extraheavy",
    "Labels":"badge-labels"
  };

  const cardGrid = document.getElementById('cardGrid');
  const emptyState = document.getElementById('emptyState');
  const listView = document.getElementById('listView');
  const detailView = document.getElementById('detailView');
  const backBtn = document.getElementById('backBtn');

  function renderList(items){
    cardGrid.innerHTML = "";
    if(items.length === 0){
      emptyState.style.display = "block";
    } else {
      emptyState.style.display = "none";
      items.forEach(p => {
        const btn = document.createElement('button');
        btn.className = 'paper-card';
        btn.setAttribute('type','button');
        btn.innerHTML = `
          <div class="paper-card-top">
            <div class="paper-name">${p.jenis}</div>
            <span class="badge ${badgeClass[p.setting] || ''}">${p.setting}</span>
          </div>
          <div class="paper-meta">
            <div class="paper-meta-row"><span class="label">Ukuran</span><span class="value">${p.ukuran}</span></div>
            <div class="paper-meta-row"><span class="label">Gramatur</span><span class="value">${p.gramatur}</span></div>
          </div>
        `;
        btn.addEventListener('click', () => showDetail(p));
        cardGrid.appendChild(btn);
      });
    }
  }

  function showDetail(p){
    document.getElementById('detailNo').textContent = "Item #" + p.no;
    document.getElementById('detailName').textContent = p.jenis;
    document.getElementById('detailSize').textContent = p.ukuran;
    document.getElementById('detailGrammage').textContent = p.gramatur;
    document.getElementById('detailHeat').textContent = p.setting;
    listView.style.display = "none";
    detailView.style.display = "block";
    window.scrollTo({top:0, behavior:"instant"});
  }

  backBtn.addEventListener('click', () => {
    detailView.style.display = "none";
    listView.style.display = "block";
  });

  renderList(papers);
</script>

</body>
</html>
